<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Publica tu artículo | unimercs</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css" />

  <style>
    :root {
      --voltage: #1F3D36;
      --voltage-dark: #172F2A;
      --volt: #C8A96A;
      --midnight: #16130F;
      --paper: #F4EFE6;
      --ground: #F4EFE6;
      --line: #E2DBD0;
      --muted: #756F64;
      --font-brand: 'Space Grotesk', system-ui, sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    body {
      background: var(--ground);
      color: var(--midnight);
      font-family: var(--font-brand);
    }

    .post-head {
      padding: 38px 0 24px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--line);
    }
    .post-head h1 {
      font-size: clamp(32px, 4vw, 44px);
      font-weight: 700;
      letter-spacing: -0.04em;
      margin: 0 0 6px;
      color: var(--midnight);
    }
    .post-head p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }

    .post-split-layout {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 36px;
      padding: 36px 0 80px;
    }
    @media (max-width: 900px) {
      .post-split-layout { grid-template-columns: 1fr; }
    }

    /* Form Container */
    .post-form-card {
      background: #FFFFFF;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 36px;
      box-shadow: 0 4px 20px rgba(22, 19, 15, 0.04);
    }

    /* Photo Dropzone */
    .photo-dropzone {
      border: 2px dashed var(--line);
      border-radius: 20px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      background: var(--paper);
      transition: all 0.2s;
      margin-bottom: 24px;
    }
    .photo-dropzone:hover {
      border-color: var(--voltage);
      background: #FFFFFF;
    }
    .photo-dropzone-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--midnight);
      margin-bottom: 4px;
    }
    .photo-dropzone-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .preview-thumbnail-wrap {
      display: none;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 24px;
      max-height: 220px;
      background: #000;
    }
    .preview-thumbnail-wrap img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }
    .btn-remove-thumb {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #EF4444;
      color: white;
      border: 0;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-weight: bold;
    }

    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--midnight);
      margin-bottom: 6px;
    }
    .form-input-pill {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: 9999px;
      padding: 12px 20px;
      font-family: inherit;
      font-size: 14.5px;
      color: var(--midnight);
      outline: none;
      background: var(--paper);
      transition: all 0.2s;
    }
    .form-input-pill:focus {
      border-color: var(--voltage);
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(31, 61, 54, 0.12);
    }
    .form-textarea-pill {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: 16px;
      padding: 14px 20px;
      font-family: inherit;
      font-size: 14px;
      color: var(--midnight);
      outline: none;
      background: var(--paper);
      min-height: 90px;
      resize: vertical;
    }
    .form-textarea-pill:focus {
      border-color: var(--voltage);
      background: #FFFFFF;
    }

    .form-row-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* Condition Buttons */
    .condition-btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .condition-btn {
      background: var(--paper);
      border: 1.5px solid var(--line);
      border-radius: 9999px;
      padding: 9px 20px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--midnight);
      cursor: pointer;
      transition: all 0.15s;
    }
    .condition-btn.active {
      background: var(--midnight);
      color: #FFFFFF;
      border-color: var(--midnight);
    }

    /* Right Live Preview Card (Page 11 Mockup) */
    .preview-sticky-wrap {
      position: sticky;
      top: 90px;
    }
    .preview-card-box {
      background: #FFFFFF;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(22, 19, 15, 0.05);
    }
    .preview-heading-label {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .preview-card-squircle {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      background: var(--voltage);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 16px;
      color: #FFFFFF;
    }
    .preview-card-squircle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .error-box {
      color: #991b1b;
      font-size: 13.5px;
      margin-bottom: 18px;
      padding: 12px 16px;
      background: #fef2f2;
      border-radius: 12px;
      border-left: 4px solid #dc2626;
      display: none;
    }
    .error-box.show { display: block; }
  </style>
</head>
<body>
  <div id="site-nav"></div>

  <main>
    <section class="post-head">
      <div class="container">
        <h1>Publica tu artículo</h1>
        <p>Tarda un minuto. Tus compañeros lo verán al instante en el catálogo del campus.</p>
      </div>
    </section>

    <section class="container">
      <div class="post-split-layout">
        <!-- Left Form -->
        <div class="post-form-card">
          <div id="error-box" class="error-box"></div>

          <form id="post-form">
            <!-- Dropzone -->
            <div class="photo-dropzone" id="dropzone">
              <input type="file" id="imageInput" accept="image/*" multiple style="display:none;" />
              <div class="photo-dropzone-title">Arrastra tus fotos aquí</div>
              <div class="photo-dropzone-sub">SELECCIONA HASTA 10 FOTOS (MÁX. 5 MB CADA UNA)</div>
            </div>

            <div class="preview-thumbnail-wrap" id="thumbWrap">
              <img id="thumbImg" src="" alt="Vista previa principal" />
              <button type="button" class="btn-remove-thumb" id="btnRemoveThumb" aria-label="Quitar fotos">Quitar</button>
            </div>
            <div id="photoCount" style="display:none; margin:8px 0 16px; font-size:12px; color:var(--muted);"></div>

            <div class="form-group">
              <label class="form-label" for="title">Título</label>
              <input type="text" id="title" class="form-input-pill" placeholder="Ej. Libro de Cálculo II Stewart" required />
            </div>

            <div class="form-row-2col">
              <div class="form-group">
                <label class="form-label" for="price">Precio (COP)</label>
                <input type="number" id="price" class="form-input-pill" placeholder="$00" min="0" step="1000" required />
              </div>

              <div class="form-group">
                <label class="form-label" for="category">Categoría</label>
                <select id="category" class="form-input-pill" required style="cursor:pointer;">
                  <option value="" disabled selected>Selecciona categoría</option>
                  <option value="Libros">Libros</option>
                  <option value="Dorm">Dormitorio & Hogar</option>
                  <option value="Electrónica">Electrónica</option>
                  <option value="Computadores">Computadores</option>
                  <option value="Papelería">Papelería</option>
                  <option value="Moda">Moda y Ropa</option>
                  <option value="Bicis">Bicicletas & Rides</option>
                  <option value="Tutorías">Tutorías y gigs</option>
                  <option value="Otros">Otros</option>
                </select>
              </div>
            </div>

            <div class="form-row-2col">
              <div class="form-group">
                <label class="form-label" for="stock">Cantidad / Stock</label>
                <input type="number" id="stock" class="form-input-pill" value="1" min="1" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="sku">SKU / Referencia (Opcional)</label>
                <input type="text" id="sku" class="form-input-pill" placeholder="LIB-01" />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Condición</label>
              <div class="condition-btn-group">
                <button type="button" class="condition-btn active" data-val="used_like_new">Como nuevo</button>
                <button type="button" class="condition-btn" data-val="used_good">Buen estado</button>
                <button type="button" class="condition-btn" data-val="used">Usado</button>
                <button type="button" class="condition-btn" data-val="new">Nuevo</button>
              </div>
              <input type="hidden" id="conditionInput" value="used_like_new" />
            </div>

            <div class="form-group">
              <label class="form-label" for="description">Descripción</label>
              <textarea id="description" class="form-textarea-pill" placeholder="Cuenta el estado, la edición, por qué lo vendes..."></textarea>
            </div>

            <div class="form-group">
              <label class="form-label" for="safeZone">Punto seguro de encuentro</label>
              <select id="safeZone" class="form-input-pill" required style="cursor:pointer;">
                <option value="Biblioteca General Alfonso Borrero">Biblioteca central</option>
                <option value="Cafetería Edificio Rafael Arboleda (Ed. 67)">Cafetería Ed. Arboleda</option>
                <option value="Plazoleta Ed. Gabriel Giraldo">Plazoleta Ed. Giraldo</option>
                <option value="Centro Ático">Centro Ático</option>
                <option value="Plazoleta Central de Ingeniería">Plazoleta de Ingeniería</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="phone">Teléfono de contacto / WhatsApp</label>
              <input type="tel" id="phone" class="form-input-pill" placeholder="310 123 4567" required />
            </div>

            <button type="submit" class="btn btn-voltage" id="submitBtn" style="width:100%; padding:14px; font-size:15px; margin-top:10px;">
              Publicar
            </button>
          </form>
        </div>

        <!-- Right Live Preview Card -->
        <div class="preview-sticky-wrap">
          <div class="preview-card-box">
            <div class="preview-heading-label">VISTA PREVIA</div>
            
            <div class="preview-card-squircle" id="previewSquircle">
              <img id="livePreviewImg" src="" style="display:none;" />
              <svg id="livePreviewPlaceholder" viewBox="0 0 32 32" width="56" height="56" fill="none">
                <rect width="32" height="32" rx="9" fill="rgba(255,255,255,0.15)"/>
                <path d="M10 9.5v7a6 6 0 0 0 12 0v-7" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
                <circle cx="22" cy="9.5" r="2" fill="#C8A96A"/>
              </svg>
            </div>

            <div style="font-family:var(--font-mono); font-size:11px; font-weight:700; color:var(--voltage); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:6px;" id="livePreviewCond">
              COMO NUEVO
            </div>

            <h3 style="font-size:18px; font-weight:700; margin:0 0 8px; color:var(--midnight);" id="livePreviewTitle">
              Tu título aquí
            </h3>

            <div style="font-family:var(--font-mono); font-size:22px; font-weight:700; color:var(--midnight);" id="livePreviewPrice">
              $00 COP
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="site.js"></script>
  <script>
    UniMercs.mount('post');

    const API_BASE = 'http://localhost:5000/api';
    const token = localStorage.getItem('unimercs_token');
    const userRaw = localStorage.getItem('unimercs_current_user');
    const user = userRaw ? JSON.parse(userRaw) : null;

    if (!token || !user) {
      alert('Debes iniciar sesión para publicar.');
      window.location.href = 'login.html';
    } else if (user.phone) {
      document.getElementById('phone').value = user.phone;
    }

    // Dropzone logic
    const dropzone = document.getElementById('dropzone');
    const imageInput = document.getElementById('imageInput');
    const thumbWrap = document.getElementById('thumbWrap');
    const thumbImg = document.getElementById('thumbImg');
    const btnRemoveThumb = document.getElementById('btnRemoveThumb');
    const photoCount = document.getElementById('photoCount');
    const livePreviewImg = document.getElementById('livePreviewImg');
    const livePreviewPlaceholder = document.getElementById('livePreviewPlaceholder');

    dropzone.addEventListener('click', () => imageInput.click());

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          thumbImg.src = ev.target.result;
          thumbWrap.style.display = 'block';
          dropzone.style.display = 'none';

          livePreviewImg.src = ev.target.result;
          livePreviewImg.style.display = 'block';
          livePreviewPlaceholder.style.display = 'none';
          photoCount.textContent = `${imageInput.files.length} foto${imageInput.files.length === 1 ? '' : 's'} seleccionada${imageInput.files.length === 1 ? '' : 's'}`;
          photoCount.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });

    btnRemoveThumb.addEventListener('click', () => {
      imageInput.value = '';
      thumbImg.src = '';
      thumbWrap.style.display = 'none';
      photoCount.style.display = 'none';
      dropzone.style.display = 'block';

      livePreviewImg.src = '';
      livePreviewImg.style.display = 'none';
      livePreviewPlaceholder.style.display = 'block';
    });

    // Condition buttons
    const conditionBtns = document.querySelectorAll('.condition-btn');
    const conditionInput = document.getElementById('conditionInput');
    const livePreviewCond = document.getElementById('livePreviewCond');

    conditionBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        conditionBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        conditionInput.value = btn.dataset.val;
        livePreviewCond.textContent = btn.textContent.toUpperCase();
      });
    });

    // Live Title and Price sync
    const titleInput = document.getElementById('title');
    const priceInput = document.getElementById('price');
    const livePreviewTitle = document.getElementById('livePreviewTitle');
    const livePreviewPrice = document.getElementById('livePreviewPrice');

    titleInput.addEventListener('input', () => {
      livePreviewTitle.textContent = titleInput.value.trim() || 'Tu título aquí';
    });

    priceInput.addEventListener('input', () => {
      const val = Number(priceInput.value);
      livePreviewPrice.textContent = val ? `$${val.toLocaleString('es-CO')} COP` : '$00 COP';
    });

    // Form submit
    const form = document.getElementById('post-form');
    const errorBox = document.getElementById('error-box');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('show');

      const title = titleInput.value.trim();
      const category = document.getElementById('category').value;
      const condition = conditionInput.value;
      const price = priceInput.value;
      const stock = document.getElementById('stock').value;
      const sku = document.getElementById('sku').value.trim();
      const safeZone = document.getElementById('safeZone').value;
      const phone = document.getElementById('phone').value.trim();
      const description = document.getElementById('description').value.trim();

      const formData = new FormData();
      formData.append('title', title);
      formData.append('category', category);
      formData.append('condition', condition);
      formData.append('price', price);
      formData.append('stock', stock || 1);
      if (sku) formData.append('sku', sku);
      formData.append('safeZone', safeZone);
      formData.append('phone', phone);
      formData.append('description', description);

      Array.from(imageInput.files).slice(0, 10).forEach(file => formData.append('images', file));

      submitBtn.disabled = true;
      submitBtn.textContent = 'Publicando...';

      try {
        const res = await fetch(`${API_BASE}/posts`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Error al publicar artículo');

        alert('¡Publicación creada exitosamente!');
        window.location.href = 'index.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Publicar';
      }
    });
  </script>
</body>
</html>
