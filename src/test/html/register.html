<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crear cuenta | unimercs</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css" />
  <!-- Awesome-Phonenumber: Reconocimiento ultra-rápido y exacto de números de teléfono mundiales (Google libphonenumber wrapper) -->
  <script src="https://cdn.jsdelivr.net/npm/awesome-phonenumber@5.9.0/dist/awesome-phonenumber.min.js"></script>

  <style>
    :root {
      --voltage: #1F3D36;
      --voltage-dark: #172F2A;
      --volt: #C8A96A;
      --midnight: #16130F;
      --paper: #F4EFE6;
      --ground: #F4EFE6;
      --line: #E2DBD0;
      --muted: #756F64;
      --font-brand: 'Space Grotesk', system-ui, sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100vh; margin: 0; padding: 0; }
    body {
      font-family: var(--font-brand);
      background: #FFFFFF;
      color: var(--midnight);
      -webkit-font-smoothing: antialiased;
    }

    .auth-split-wrapper {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      min-height: 100vh;
      width: 100%;
    }

    /* Left Voltage Purple Screen */
    .auth-left-banner {
      background: var(--voltage);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 40px;
      text-align: center;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .auth-big-logo {
      width: 120px;
      height: 120px;
      margin-bottom: 40px;
    }
    .auth-left-banner h2 {
      font-size: clamp(34px, 4vw, 48px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.04em;
      margin: 0;
      color: #FFFFFF;
    }
    .auth-left-banner h2 span {
      color: var(--volt);
      display: block;
    }

    /* Right Form Area */
    .auth-right-area {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
      background: #FFFFFF;
      overflow-y: auto;
    }
    .auth-form-card {
      width: 100%;
      max-width: 480px;
    }

    .auth-brand-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .auth-heading {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0 0 6px;
      color: var(--midnight);
    }
    .auth-subhead {
      color: var(--muted);
      font-size: 14.5px;
      margin: 0 0 24px;
    }

    /* Role selector */
    .account-type-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .type-card {
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
      cursor: pointer;
      background: var(--paper);
      transition: all 0.15s;
    }
    .type-card input { display: none; }
    .type-card.active {
      border-color: var(--voltage);
      background: #FFFFFF;
      box-shadow: 0 0 0 2px rgba(31, 61, 54, 0.15);
    }
    .type-card .type-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--midnight);
    }
    .type-card.active .type-title { color: var(--voltage); }

    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--midnight);
      margin-bottom: 5px;
    }
    .form-input-pill {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: 9999px;
      padding: 11px 18px;
      font-family: inherit;
      font-size: 14px;
      color: var(--midnight);
      outline: none;
      background: var(--paper);
      transition: all 0.2s;
    }
    .form-input-pill:focus {
      border-color: var(--voltage);
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(31, 61, 54, 0.12);
    }

    .phone-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }
    .phone-flag-pill-badge {
      position: absolute;
      left: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      user-select: none;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .phone-flag-pill-badge img {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    .form-input-pill.phone-auto-input {
      padding-left: 48px !important;
      font-family: var(--font-brand);
      font-size: 14.5px;
    }

    .terms-box {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 18px 0 22px;
      font-size: 12.5px;
      color: var(--muted);
    }
    .terms-box input {
      accent-color: var(--voltage);
      width: 16px;
      height: 16px;
      margin-top: 2px;
    }
    .terms-box a { color: var(--voltage); text-decoration: underline; }

    .btn-auth-submit {
      width: 100%;
      background: var(--voltage);
      color: #FFFFFF;
      border: 0;
      border-radius: 9999px;
      padding: 13px 24px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }
    .btn-auth-submit:hover:not(:disabled) {
      background: var(--voltage-dark);
      transform: translateY(-1px);
    }
    .btn-auth-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .auth-bottom-prompt {
      text-align: center;
      margin-top: 20px;
      font-size: 13.5px;
      color: var(--muted);
    }
    .auth-bottom-prompt a {
      color: var(--midnight);
      font-weight: 700;
      text-decoration: none;
    }
    .auth-bottom-prompt a:hover { color: var(--voltage); text-decoration: underline; }

    .error-box {
      color: #991b1b;
      font-size: 13px;
      margin-bottom: 16px;
      padding: 10px 14px;
      background: #fef2f2;
      border-radius: 12px;
      border-left: 4px solid #dc2626;
      display: none;
    }
    .error-box.show { display: block; }
    .success-box {
      color: #065f46;
      font-size: 13px;
      margin-bottom: 16px;
      padding: 10px 14px;
      background: #f0fdf4;
      border-radius: 12px;
      border-left: 4px solid #10b981;
      display: none;
    }
    .success-box.show { display: block; }

    @media (max-width: 840px) {
      .auth-split-wrapper { grid-template-columns: 1fr; }
      .auth-left-banner { display: none; }
    }
  </style>
</head>
<body>

  <div class="auth-split-wrapper">
    <!-- Left Screen (Voltage) -->
    <div class="auth-left-banner">
      <svg class="auth-big-logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 9.5v7a6 6 0 0 0 12 0v-7" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="22" cy="9.5" r="2.6" fill="#C8A96A"/>
      </svg>
      <h2>
        Vende el libro.
        <span>Guarda el dinero.</span>
      </h2>
    </div>

    <!-- Right Screen (Register Form) -->
    <div class="auth-right-area">
      <div class="auth-form-card">
        <div class="auth-brand-top">
          <svg viewBox="0 0 32 32" width="34" height="34" fill="none" xmlns="http://www.w3.org/2000/svg" style="border-radius:10px; background:var(--voltage); padding:2px;">
            <path d="M10 9.5v7a6 6 0 0 0 12 0v-7" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="22" cy="9.5" r="2.6" fill="#C8A96A"/>
          </svg>
          <span style="font-weight:700; font-size:22px; letter-spacing:-0.03em;">unimercs</span>
        </div>

        <h1 class="auth-heading">Crear cuenta</h1>
        <p class="auth-subhead">Solo estudiantes verificados: usa tu correo institucional.</p>

        <div id="error-message" class="error-box"></div>
        <div id="success-message" class="success-box"></div>

        <form id="register-form">
          <!-- Role selector -->
          <div class="form-group">
            <label class="form-label">Tipo de perfil</label>
            <div class="account-type-grid">
              <label class="type-card" id="card-buyer">
                <input type="radio" name="accountType" value="buyer" />
                <div class="type-title">Comprador</div>
              </label>
              <label class="type-card active" id="card-seller">
                <input type="radio" name="accountType" value="seller" checked />
                <div class="type-title">Vendedor</div>
              </label>
              <label class="type-card" id="card-store">
                <input type="radio" name="accountType" value="store" />
                <div class="type-title">Tienda</div>
              </label>
            </div>
          </div>

          <!-- Store fields if store selected -->
          <div id="store-fields-box" style="display:none; background:var(--paper); padding:14px; border-radius:14px; border:1px solid var(--line); margin-bottom:16px;">
            <div class="form-group" style="margin-bottom:8px;">
              <label class="form-label" for="storeName">Nombre de la tienda</label>
              <input type="text" id="storeName" class="form-input-pill" placeholder="Ej. Javeriana Stickers & Snacks" />
            </div>
            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label" for="storeDescription">Descripción del catálogo</label>
              <input type="text" id="storeDescription" class="form-input-pill" placeholder="Ej. Accesorios universitarios y snacks" />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="name">Nombre completo</label>
            <input type="text" id="name" class="form-input-pill" placeholder="Tu nombre y apellido" required autocomplete="name" />
          </div>

          <div class="form-group">
            <label class="form-label" for="university">Universidad</label>
            <input type="text" id="university" class="form-input-pill" value="Pontificia Universidad Javeriana" readonly style="background:#E8EFE8;" />
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Correo institucional</label>
            <input type="email" id="email" class="form-input-pill" placeholder="tu@javeriana.edu.co" required autocomplete="email" />
          </div>

          <div class="form-group">
            <label class="form-label" for="phone">Teléfono / WhatsApp</label>
            <div class="phone-input-wrapper">
              <div class="phone-flag-pill-badge" id="phoneFlagBadge">
                <img id="phoneFlagImg" src="https://hatscripts.github.io/circle-flags/flags/co.svg" alt="Bandera" />
              </div>
              <input type="tel" id="phone" class="form-input-pill phone-auto-input" placeholder="310 123 4567" required autocomplete="tel" />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Contraseña</label>
            <input type="password" id="password" class="form-input-pill" placeholder="Mínimo 8 caracteres" required minlength="8" autocomplete="new-password" />
          </div>

          <div class="terms-box">
            <input type="checkbox" id="terms" required checked />
            <label for="terms">
              Acepto los <a href="terms.html">términos de uso</a> y la <a href="privacy.html">política de privacidad</a>.
            </label>
          </div>

          <button type="submit" class="btn-auth-submit" id="submit-btn">Crear cuenta</button>

          <div class="auth-bottom-prompt">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/api';

    // Manejo de Selector de Rol
    const typeCards = document.querySelectorAll('.type-card');
    const storeBox = document.getElementById('store-fields-box');

    typeCards.forEach(card => {
      card.addEventListener('click', () => {
        typeCards.forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        const radio = card.querySelector('input');
        radio.checked = true;

        if (radio.value === 'store') {
          storeBox.style.display = 'block';
        } else {
          storeBox.style.display = 'none';
        }
      });
    });

    const registerForm = document.getElementById('register-form');
    const errBox = document.getElementById('error-message');
    const succBox = document.getElementById('success-message');
    const submitBtn = document.getElementById('submit-btn');
    const phoneInput = document.getElementById('phone');
    const phoneFlagImg = document.getElementById('phoneFlagImg');
    const phoneFlagBadge = document.getElementById('phoneFlagBadge');

    // Base de datos de códigos telefónicos mundiales ordenada por longitud de prefijo
    const WORLD_PREFIXES = [
      { code: '593', iso: 'ec' }, // Ecuador
      { code: '507', iso: 'pa' }, // Panamá
      { code: '506', iso: 'cr' }, // Costa Rica
      { code: '505', iso: 'ni' }, // Nicaragua
      { code: '504', iso: 'hn' }, // Honduras
      { code: '503', iso: 'sv' }, // El Salvador
      { code: '502', iso: 'gt' }, // Guatemala
      { code: '591', iso: 'bo' }, // Bolivia
      { code: '595', iso: 'py' }, // Paraguay
      { code: '598', iso: 'uy' }, // Uruguay
      { code: '509', iso: 'ht' }, // Haití
      { code: '57',  iso: 'co' }, // Colombia
      { code: '58',  iso: 've' }, // Venezuela
      { code: '55',  iso: 'br' }, // Brasil
      { code: '54',  iso: 'ar' }, // Argentina
      { code: '56',  iso: 'cl' }, // Chile
      { code: '51',  iso: 'pe' }, // Perú
      { code: '52',  iso: 'mx' }, // México
      { code: '34',  iso: 'es' }, // España
      { code: '44',  iso: 'gb' }, // Reino Unido
      { code: '33',  iso: 'fr' }, // Francia
      { code: '49',  iso: 'de' }, // Alemania
      { code: '39',  iso: 'it' }, // Italia
      { code: '351', iso: 'pt' }, // Portugal
      { code: '81',  iso: 'jp' }, // Japón
      { code: '82',  iso: 'kr' }, // Corea del Sur
      { code: '86',  iso: 'cn' }, // China
      { code: '91',  iso: 'in' }, // India
      { code: '61',  iso: 'au' }, // Australia
      { code: '1',   iso: 'us' }  // USA / Canadá
    ];

    let currentIso = 'co';
    let fullRecognizedPhone = '';

    function getFlagSvgUrl(iso) {
      const code = (iso || 'co').toLowerCase();
      return `https://hatscripts.github.io/circle-flags/flags/${code}.svg`;
    }

    function popFlag(iso) {
      if (!phoneFlagImg) return;
      const cleanIso = (iso || 'co').toLowerCase();
      if (currentIso !== cleanIso) {
        currentIso = cleanIso;
        phoneFlagImg.src = getFlagSvgUrl(cleanIso);
        if (phoneFlagBadge) {
          phoneFlagBadge.style.transform = 'scale(1.4)';
          setTimeout(() => {
            if (phoneFlagBadge) phoneFlagBadge.style.transform = 'scale(1)';
          }, 180);
        }
      }
    }

    // Geolocalización IP inicial para pre-asignar país por defecto (Colombia como estándar)
    async function initGeoCountry() {
      try {
        const res = await fetch('https://ipapi.co/json/');
        if (!res.ok) return;
        const data = await res.json();
        if (data.country_code) {
          currentIso = data.country_code.toLowerCase();
          popFlag(currentIso);
        }
      } catch (e) {
        popFlag('co');
      }
    }
    initGeoCountry();

    // Auto-detección en cada pulsación de tecla analizando sintaxis y prefijos mundiales
    phoneInput.addEventListener('input', () => {
      let raw = phoneInput.value.trim();
      const digits = raw.replace(/\D/g, '');

      if (!raw || digits.length < 2) {
        popFlag('co');
        fullRecognizedPhone = '';
        return;
      }

      // Si empieza por 3 y tiene entre 7 y 10 dígitos -> Colombia de inmediato
      if (digits.startsWith('3') && !raw.startsWith('+') && !raw.startsWith('00') && digits.length <= 10) {
        popFlag('co');
        fullRecognizedPhone = `+57${digits}`;
        return;
      }

      // 1. Usar AwesomePhonenumber / parseador internacional
      let detectedIso = null;
      if (window.AwesomePhoneNumber) {
        try {
          let testNumber = raw;
          if (!raw.startsWith('+') && !raw.startsWith('00')) {
            testNumber = '+' + digits;
          }
          const pn = new window.AwesomePhoneNumber(testNumber);
          if (pn.isValid() || pn.isPossible()) {
            const countryCode = pn.getCountryCode();
            const r = pn.getRegionCode();
            if (r) detectedIso = r.toLowerCase();
          }
        } catch (e) {}
      }

      // 2. Si no se detectó por librería, buscar en tabla de prefijos mundiales
      if (!detectedIso) {
        if (raw.startsWith('+') || raw.startsWith('00')) {
          const cleanDigits = raw.startsWith('00') ? digits.substring(2) : digits;
          for (const item of WORLD_PREFIXES) {
            if (cleanDigits.startsWith(item.code)) {
              detectedIso = item.iso;
              break;
            }
          }
        } else {
          // Detectar por inicio de prefijo o número nacional
          for (const item of WORLD_PREFIXES) {
            if (digits.startsWith(item.code) && digits.length > item.code.length + 5) {
              detectedIso = item.iso;
              break;
            }
          }
        }
      }

      // Si sigue sin detectarse pero es un número común sin prefijo
      if (!detectedIso) {
        if (digits.startsWith('3') || digits.startsWith('57')) {
          detectedIso = 'co';
        } else if (digits.startsWith('55') || digits.startsWith('81')) {
          detectedIso = 'mx';
        } else if (digits.startsWith('6') || digits.startsWith('7')) {
          detectedIso = 'es';
        } else {
          detectedIso = 'co';
        }
      }

      popFlag(detectedIso);

      // Calcular fullPhone internacional
      if (raw.startsWith('+')) {
        fullRecognizedPhone = '+' + digits;
      } else {
        const found = WORLD_PREFIXES.find(x => x.iso === detectedIso);
        const code = found ? found.code : '57';
        if (digits.startsWith(code)) {
          fullRecognizedPhone = '+' + digits;
        } else {
          fullRecognizedPhone = `+${code}${digits}`;
        }
      }
    });

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.remove('show');
      succBox.classList.remove('show');

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const university = document.getElementById('university').value.trim();
      const password = document.getElementById('password').value;
      const accountType = document.querySelector('input[name="accountType"]:checked')?.value || 'seller';
      const storeName = document.getElementById('storeName').value.trim();
      const storeDescription = document.getElementById('storeDescription').value.trim();

      const rawPhone = phoneInput.value.trim();
      // `fullRecognizedPhone` y `currentIso` se actualizan con cada cambio del campo.
      // No se solicita ni valida un código SMS durante el registro.
      let fullPhone = fullRecognizedPhone || rawPhone;

      // Asegurar que tenga prefijo internacional si se ingresó solo el número local
      if (!fullPhone.startsWith('+')) {
        const cleanDigits = fullPhone.replace(/\D/g, '');
        if (currentIso === 'co' || !currentIso) {
          fullPhone = `+57${cleanDigits}`;
        } else {
          const detected = WORLD_PREFIXES.find(item => item.iso === currentIso);
          fullPhone = `+${detected ? detected.code : '57'}${cleanDigits}`;
        }
      }

      if (!rawPhone || rawPhone.replace(/\D/g, '').length < 7) {
        errBox.textContent = 'Por favor ingresa un número de teléfono válido';
        errBox.classList.add('show');
        return;
      }

      if (!email.endsWith('@javeriana.edu.co')) {
        errBox.textContent = 'Debes usar tu correo institucional (@javeriana.edu.co)';
        errBox.classList.add('show');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creando cuenta...';

      try {
        const res = await fetch(`${API_BASE}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name,
            email,
            password,
            phone: fullPhone,
            university,
            accountType,
            storeName,
            storeDescription
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Error al registrar usuario');

        localStorage.setItem('unimercs_token', data.token);
        localStorage.setItem('unimercs_current_user', JSON.stringify(data.user));

        succBox.textContent = '¡Cuenta creada exitosamente! Redirigiendo...';
        succBox.classList.add('show');

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 800);
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Crear cuenta';
      }
    });
  </script>
</body>
</html>
