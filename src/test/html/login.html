<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión | unimercs</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css" />

  <style>
    :root {
      --voltage: #1F3D36;
      --voltage-dark: #172F2A;
      --volt: #C8A96A;
      --midnight: #16130F;
      --paper: #F4EFE6;
      --ground: #F4EFE6;
      --line: #E2DBD0;
      --muted: #756F64;
      --font-brand: 'Space Grotesk', system-ui, sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100vh; margin: 0; padding: 0; }
    body {
      font-family: var(--font-brand);
      background: #FFFFFF;
      color: var(--midnight);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    .auth-split-wrapper {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      min-height: 100vh;
      width: 100%;
    }

    /* Left Purple Visual Banner */
    .auth-left-banner {
      background: var(--voltage);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .auth-big-logo {
      width: 120px;
      height: 120px;
      margin-bottom: 40px;
    }
    .auth-left-banner h2 {
      font-size: clamp(34px, 4vw, 48px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.04em;
      margin: 0;
      color: #FFFFFF;
    }
    .auth-left-banner h2 span {
      color: var(--volt);
      display: block;
    }

    /* Right Form Area */
    .auth-right-area {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
      background: #FFFFFF;
    }
    .auth-form-card {
      width: 100%;
      max-width: 420px;
    }

    .auth-brand-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .auth-heading {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0 0 6px;
      color: var(--midnight);
    }
    .auth-subhead {
      color: var(--muted);
      font-size: 14.5px;
      margin: 0 0 28px;
    }

    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--midnight);
      margin-bottom: 6px;
    }
    .form-input-pill {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: 9999px;
      padding: 12px 20px;
      font-family: inherit;
      font-size: 14.5px;
      color: var(--midnight);
      outline: none;
      background: var(--paper);
      transition: all 0.2s;
    }
    .form-input-pill:focus {
      border-color: var(--voltage);
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(31, 61, 54, 0.12);
    }

    .password-wrap { position: relative; }
    .toggle-password {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 0;
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .form-links-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 22px;
    }
    .forgot-pass-link {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
      cursor: pointer;
    }
    .forgot-pass-link:hover { color: var(--voltage); text-decoration: underline; }

    .btn-auth-submit {
      width: 100%;
      background: var(--voltage);
      color: #FFFFFF;
      border: 0;
      border-radius: 9999px;
      padding: 13px 24px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }
    .btn-auth-submit:hover:not(:disabled) {
      background: var(--voltage-dark);
      transform: translateY(-1px);
    }
    .btn-auth-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .auth-bottom-prompt {
      text-align: center;
      margin-top: 24px;
      font-size: 13.5px;
      color: var(--muted);
    }
    .auth-bottom-prompt a {
      color: var(--midnight);
      font-weight: 700;
      text-decoration: none;
    }
    .auth-bottom-prompt a:hover { color: var(--voltage); text-decoration: underline; }

    .error-box {
      color: #991b1b;
      font-size: 13px;
      margin-bottom: 16px;
      padding: 10px 14px;
      background: #fef2f2;
      border-radius: 12px;
      border-left: 4px solid #dc2626;
      display: none;
    }
    .error-box.show { display: block; }
    .success-box {
      color: #065f46;
      font-size: 13px;
      margin-bottom: 16px;
      padding: 10px 14px;
      background: #f0fdf4;
      border-radius: 12px;
      border-left: 4px solid #10b981;
      display: none;
    }
    .success-box.show { display: block; }

    /* Modal Recuperar */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(22, 19, 15, 0.65);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal-card {
      background: #FFFFFF;
      border-radius: 20px;
      max-width: 440px;
      width: 100%;
      padding: 30px;
      box-shadow: 0 25px 60px rgba(22, 19, 15, 0.35);
      border: 1px solid var(--line);
    }

    @media (max-width: 800px) {
      .auth-split-wrapper { grid-template-columns: 1fr; }
      .auth-left-banner { display: none; }
    }
  </style>
</head>
<body>

  <div class="auth-split-wrapper">
    <!-- Left Voltage Purple Screen -->
    <div class="auth-left-banner">
      <svg class="auth-big-logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 9.5v7a6 6 0 0 0 12 0v-7" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="22" cy="9.5" r="2.6" fill="#C8A96A"/>
      </svg>
      <h2>
        Vende el libro.
        <span>Guarda el dinero.</span>
      </h2>
    </div>

    <!-- Right Login Form Screen -->
    <div class="auth-right-area">
      <div class="auth-form-card">
        <div class="auth-brand-top">
          <svg viewBox="0 0 32 32" width="34" height="34" fill="none" xmlns="http://www.w3.org/2000/svg" style="border-radius:10px; background:var(--voltage); padding:2px;">
            <path d="M10 9.5v7a6 6 0 0 0 12 0v-7" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="22" cy="9.5" r="2.6" fill="#C8A96A"/>
          </svg>
          <span style="font-weight:700; font-size:22px; letter-spacing:-0.03em;">unimercs</span>
        </div>

        <h1 class="auth-heading">Iniciar sesión</h1>
        <p class="auth-subhead">Entra con tu correo universitario.</p>

        <div id="error-message" class="error-box"></div>
        <div id="success-message" class="success-box"></div>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="email">Correo</label>
            <input type="email" id="email" class="form-input-pill" placeholder="tu@universidad.edu.co" required autocomplete="email" />
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Contraseña</label>
            <div class="password-wrap">
              <input type="password" id="password" class="form-input-pill" placeholder="••••••••" required autocomplete="current-password" />
              <button type="button" class="toggle-password" id="toggle-password">Ver</button>
            </div>
          </div>

          <div class="form-links-row">
            <a class="forgot-pass-link" id="open-forgot-modal">Olvidé mi contraseña</a>
          </div>

          <button type="submit" class="btn-auth-submit" id="submit-btn">Iniciar sesión</button>

          <div class="auth-bottom-prompt">
            ¿No tienes cuenta? <a href="register.html">Regístrate</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal Recuperar Contraseña -->
  <div class="modal-overlay" id="forgot-modal">
    <div class="modal-card">
      <h3 style="margin:0 0 6px; font-size:20px; font-weight:700;">Recuperar contraseña</h3>
      <p style="margin:0 0 18px; font-size:13.5px; color:var(--muted);">Te enviaremos un código de 6 dígitos a tu correo institucional.</p>

      <div id="forgot-step-1">
        <div class="form-group">
          <label class="form-label" for="forgot-email">Correo institucional</label>
          <input type="email" id="forgot-email" class="form-input-pill" placeholder="usuario@javeriana.edu.co" />
        </div>
        <button type="button" class="btn-auth-submit" id="btn-request-code" style="margin-bottom:10px;">Enviar código</button>
      </div>

      <div id="forgot-step-2" style="display:none;">
        <div class="form-group">
          <label class="form-label" for="reset-code">Código recibido (6 dígitos)</label>
          <input type="text" id="reset-code" class="form-input-pill" placeholder="123456" maxlength="6" />
        </div>
        <div class="form-group">
          <label class="form-label" for="reset-new-password">Nueva contraseña</label>
          <input type="password" id="reset-new-password" class="form-input-pill" placeholder="Mínimo 6 caracteres" />
        </div>
        <button type="button" class="btn-auth-submit" id="btn-confirm-reset" style="margin-bottom:10px;">Restablecer contraseña</button>
      </div>

      <button type="button" class="btn" id="btn-close-forgot" style="width:100%; border-color:var(--line);">Cancelar</button>
    </div>
  </div>

  <script>
    const API_BASE = '/api';

    const toggleBtn = document.getElementById('toggle-password');
    const pwdInput = document.getElementById('password');
    toggleBtn?.addEventListener('click', () => {
      const isPwd = pwdInput.type === 'password';
      pwdInput.type = isPwd ? 'text' : 'password';
      toggleBtn.textContent = isPwd ? 'Ocultar' : 'Ver';
    });

    const loginForm = document.getElementById('login-form');
    const errBox = document.getElementById('error-message');
    const succBox = document.getElementById('success-message');
    const submitBtn = document.getElementById('submit-btn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.remove('show');
      succBox.classList.remove('show');

      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Verificando...';

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.message || 'Error al iniciar sesión');
        }

        localStorage.setItem('unimercs_token', data.token);
        localStorage.setItem('unimercs_current_user', JSON.stringify(data.user));

        succBox.textContent = `Bienvenido(a), ${data.user.name}`;
        succBox.classList.add('show');

        setTimeout(() => {
          if (data.user.role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'index.html';
          }
        }, 600);
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Iniciar sesión';
      }
    });

    // Forgot password
    const forgotModal = document.getElementById('forgot-modal');
    const openForgotBtn = document.getElementById('open-forgot-modal');
    const closeForgotBtn = document.getElementById('btn-close-forgot');
    const btnRequestCode = document.getElementById('btn-request-code');
    const btnConfirmReset = document.getElementById('btn-confirm-reset');
    const step1 = document.getElementById('forgot-step-1');
    const step2 = document.getElementById('forgot-step-2');

    openForgotBtn.addEventListener('click', () => {
      forgotModal.classList.add('open');
      step1.style.display = 'block';
      step2.style.display = 'none';
      document.getElementById('forgot-email').value = document.getElementById('email').value;
    });

    closeForgotBtn.addEventListener('click', () => {
      forgotModal.classList.remove('open');
    });

    let currentResetEmail = '';

    btnRequestCode.addEventListener('click', async () => {
      const email = document.getElementById('forgot-email').value.trim().toLowerCase();
      if (!email) return alert('Ingresa tu correo institucional');

      btnRequestCode.disabled = true;
      btnRequestCode.textContent = 'Enviando...';

      try {
        const res = await fetch(`${API_BASE}/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);

        currentResetEmail = email;
        alert(data.message);
        step1.style.display = 'none';
        step2.style.display = 'block';
      } catch (err) {
        alert(err.message);
      } finally {
        btnRequestCode.disabled = false;
        btnRequestCode.textContent = 'Enviar código';
      }
    });

    btnConfirmReset.addEventListener('click', async () => {
      const code = document.getElementById('reset-code').value.trim();
      const newPassword = document.getElementById('reset-new-password').value;

      if (!code || !newPassword) return alert('Ingresa el código y la nueva contraseña');

      btnConfirmReset.disabled = true;
      btnConfirmReset.textContent = 'Restableciendo...';

      try {
        const res = await fetch(`${API_BASE}/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentResetEmail, code, newPassword })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);

        alert('Contraseña restablecida correctamente.');
        forgotModal.classList.remove('open');
        document.getElementById('email').value = currentResetEmail;
        document.getElementById('password').value = newPassword;
      } catch (err) {
        alert(err.message);
      } finally {
        btnConfirmReset.disabled = false;
        btnConfirmReset.textContent = 'Restablecer contraseña';
      }
    });
  </script>
</body>
</html>
