        <text x="25" y="90" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="36" fill="#FFF">1,248</text>

        <g transform="translate(385, 0)">
          <rect width="360" height="120" rx="16" fill="#161138" stroke="#2D245A"/>
